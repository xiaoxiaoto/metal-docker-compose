load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    access_log /var/log/nginx/access.log;
    js_import router from /etc/nginx/router.mjs;

    server {
        listen 80;
        client_max_body_size 25m;
        # njs requestBuffer requires the request body to remain in memory.
        client_body_buffer_size 26m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        set $lifecycle_service "";
        proxy_set_header X-Model-Lifecycle-Service $lifecycle_service;
        proxy_connect_timeout 5s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_buffering off;

        location = /health {
            return 200 '{"status":"ok","scope":"gateway"}';
        }

        location = /v1/systemone {
            client_max_body_size 100m;
            set $lifecycle_service h2o-lightning-4b;
            proxy_read_timeout 2400s;
            proxy_pass http://host.docker.internal:18100;
        }

        location = /v1/models {
            js_content router.models;
        }

        location /v1/ {
            js_content router.route;
        }

        location /_models/ {
            internal;
            proxy_connect_timeout 1s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;

            location = /_models/h2o {
                proxy_pass http://host.docker.internal:8000/v1/models;
            }
            location = /_models/higgs {
                proxy_pass http://host.docker.internal:8095/v1/models;
            }
            location = /_models/yue2 {
                proxy_pass http://host.docker.internal:8096/v1/models;
            }
            location = /_models/moss {
                proxy_pass http://host.docker.internal:8097/v1/models;
            }
            location = /_models/paddleocr {
                proxy_pass http://host.docker.internal:8098/v1/models;
            }
            location = /_models/qwenimage {
                proxy_pass http://host.docker.internal:8099/v1/models;
            }
            location = /_models/seedvr2 {
                proxy_pass http://host.docker.internal:8100/v1/models;
            }
        }

        location @h2o {
            set $lifecycle_service h2o-lightning-4b;
            proxy_read_timeout 2400s;
            proxy_pass http://host.docker.internal:18100;
        }

        location @higgs {
            set $lifecycle_service higgs-audio-v3-tts-4b;
            proxy_read_timeout 2400s;
            proxy_pass http://host.docker.internal:18100;
        }

        location @yue2 {
            set $lifecycle_service yue2-3b;
            proxy_read_timeout 2400s;
            proxy_pass http://host.docker.internal:18100;
        }

        location @moss {
            set $lifecycle_service moss-transcribe-diarize;
            proxy_read_timeout 2400s;
            proxy_pass http://host.docker.internal:18100;
        }

        location @paddleocr {
            set $lifecycle_service paddleocr-vl;
            proxy_read_timeout 2400s;
            proxy_pass http://host.docker.internal:18100;
        }

        location @qwenimage {
            set $lifecycle_service qwen-image-2.1-turbo;
            proxy_read_timeout 2400s;
            proxy_pass http://host.docker.internal:18100;
        }

        location @seedvr2 {
            set $lifecycle_service seedvr2;
            proxy_read_timeout 3600s;
            proxy_pass http://host.docker.internal:18100;
        }

        location / {
            return 404 '{"error":{"message":"Use /v1/ endpoints"}}';
        }
    }
}
